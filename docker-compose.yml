services:
  db:
    image: postgres:15-alpine
    container_name: money_tracker_db
    environment:
      POSTGRES_USER: stef
      POSTGRES_PASSWORD: password
      POSTGRES_DB: money_tracker
    ports:
      - "5432:5432"
  redis:
    image: redis:latest
    container_name: money_tracker_redis
    ports:
      - "6379:6379"